name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1
      - run: bash -n install.sh && bash -n uninstall.sh
      - run: /usr/bin/python3 -m unittest discover -s tests
